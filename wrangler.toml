name = "fanfiction-fyi"
compatibility_date = "2026-04-27"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Non-secret plaintext environment variables.
# Override per-environment via the Cloudflare Pages dashboard
# (Pages → project → Settings → Environment variables) or with:
#   npx wrangler pages secret put FOUNDER_EMAIL   # for secrets
# See .env.example for full documentation of each variable.
# Environment variables are managed via Cloudflare Pages secrets:
#   wrangler pages secret put GOOGLE_CLIENT_ID --project-name fanfiction-fyi
#   wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name fanfiction-fyi
#   wrangler pages secret put FOUNDER_EMAIL --project-name fanfiction-fyi
#   wrangler pages secret put GITHUB_TOKEN --project-name fanfiction-fyi
# Do NOT add secrets to [vars] below — they override Pages secrets.

[[d1_databases]]
binding = "DB"
database_name = "fanfiction-fyi-db"
database_id = "d4a29888-6e20-4391-8aa0-c131b4c36d88"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "fanfiction-fyi-media"

# Smart Placement runs the Worker in the closest Cloudflare location
# to the D1 database, reducing latency for data-bound requests.
[placement]
mode = "smart"